name: Update Official Data

on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: official-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for official data changes
        id: check
        shell: bash
        run: |
          set +e
          node scripts/check-data.mjs --fail-on-change
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Official data is already current."
          elif [ "$status" -eq 2 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Official data changed; syncing and publishing."
          elif [ "$status" -eq 3 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Fontes oficiais indisponiveis::DECEA inacessivel (rede) apos varias tentativas. Pulando hoje; o agendamento tenta novamente amanha."
          elif [ "$status" -eq 4 ]; then
            echo "::error title=Camada do GeoAISWEB quebrada::Uma ou mais camadas do DECEA falharam por erro nao-transitorio (provavel rename/remocao). A sincronizacao foi ABORTADA para nao publicar dado parcial. Os dados param de atualizar ate isso ser corrigido."
            exit 1
          else
            exit "$status"
          fi

      - name: Sync official data
        if: steps.check.outputs.changed == 'true'
        run: npm run data:sync

      - name: Validate synced data
        if: steps.check.outputs.changed == 'true'
        run: |
          node scripts/check-data.mjs --fail-on-change
          npm run build
          npm run build:single

      - name: Detect local diff
        if: steps.check.outputs.changed == 'true'
        id: diff
        shell: bash
        run: |
          # git status --porcelain enxerga tambem arquivos novos; git diff nao,
          # e um arquivo gerado pela primeira vez seria descartado em silencio.
          mudados="$(git status --porcelain | awk '{print $NF}')"
          if [ -z "$mudados" ]; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "No file changes after sync."
            exit 0
          fi
          echo "has_diff=true" >> "$GITHUB_OUTPUT"

          # Se so o metadata mudou (D-AMDT nova do ROTAER ou revalidacao semanal
          # sem dado novo), registra mas nao publica: o app gerado seria
          # identico, porque ele nao usa nada do ROTAER.
          if [ "$mudados" = "src/data/metadata.json" ]; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "Only metadata changed; will commit without deploying."
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "Data files changed:"
            echo "$mudados" | sed 's/^/  /'
          fi

      - name: Commit and publish to default branch
        if: steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DATA_CHANGED: ${{ steps.diff.outputs.data_changed }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "$DATA_CHANGED" = "true" ]; then
            git commit -m "Atualiza dados oficiais do ROTAER/GeoAISWEB (automatico)"
          else
            git commit -m "Registra checagem das fontes oficiais, sem dado novo (automatico)"
          fi

          # Publica direto no branch padrao; em caso de corrida, rebase e tenta de novo.
          git push origin "HEAD:${DEFAULT_BRANCH}" \
            || ( git pull --rebase origin "${DEFAULT_BRANCH}" \
                 && git push origin "HEAD:${DEFAULT_BRANCH}" )

          # O commit so do metadata precisa entrar mesmo sem deploy: e a data dele
          # que a revalidacao semanal do check-data usa como referencia.
          if [ "$DATA_CHANGED" != "true" ]; then
            echo "Metadata registrada; app inalterado, deploy dispensado."
            exit 0
          fi

          # Push via GITHUB_TOKEN nao dispara outros workflows; aciona o deploy explicitamente.
          gh workflow run deploy-pages.yml --ref "${DEFAULT_BRANCH}"
          echo "::notice title=Dados publicados::Dados oficiais atualizados e deploy do GitHub Pages acionado."
