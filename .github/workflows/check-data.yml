name: Check Official Data

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check official data freshness
        shell: bash
        run: |
          set +e
          node scripts/check-data.mjs --fail-on-change
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Official data is current."
          elif [ "$status" -eq 2 ]; then
            # Nova emenda/camada alterada, ou revalidacao semanal (ver
            # SYNC_MAX_DIAS em check-data.mjs). O motivo esta no log acima.
            echo "::notice title=Sincronizacao pendente::Mudanca nas fontes oficiais ou revalidacao semanal. O workflow Update Official Data vai sincronizar; so publica se algum dado mudar."
          elif [ "$status" -eq 3 ]; then
            echo "::warning title=Fontes oficiais indisponiveis::DECEA inacessivel (rede) apos varias tentativas. Verificacao pulada; tenta novamente amanha."
          elif [ "$status" -eq 4 ]; then
            echo "::error title=Camada do GeoAISWEB quebrada::Uma ou mais camadas do DECEA falharam por erro nao-transitorio (provavel rename/remocao). Os dados aeronauticos PARAM de atualizar ate isso ser corrigido. Veja o log acima."
            exit 1
          elif [ "$status" -eq 5 ]; then
            echo "::error title=DECEA bloqueando acesso automatizado::A fonte respondeu com o desafio anti-robo do Cloudflare (HTTP 403, cf-mitigated: challenge). Nao e falha do projeto nem camada renomeada. Os dados aeronauticos param de atualizar ate o DECEA liberar o acesso; a checagem diaria retoma sozinha quando isso acontecer."
            exit 1
          else
            exit "$status"
          fi
