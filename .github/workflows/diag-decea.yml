name: Diagnose DECEA access

# Sondagem manual das fontes do DECEA a partir do runner do GitHub, para
# incidentes de acesso (ex.: HTTP 403 no GeoAISWEB em 23/10/2026). Rodar em
# Actions > Diagnose DECEA access > Run workflow e ler o RESUMO no log.
on:
  workflow_dispatch:
  # Temporario: dispara nesta branch enquanto o mapeamento de fontes e feito.
  push:
    branches:
      - claude/setup-local-development-hDh47
    paths:
      - scripts/**

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Probe with Node fetch (same client as the sync scripts)
        run: node scripts/diag-decea.mjs

      - name: Map alternative official sources on AISWEB
        run: node scripts/diag-fontes.mjs govbr

      - name: End-to-end sync against the real DECEA (dry run, no commit)
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          set +e
          npm run data:sync; echo ">>> data:sync exit=$?"
          node scripts/check-data.mjs --fail-on-change; echo ">>> check-data exit=$?"
          echo "--- arquivos de dados comparados com o que esta no repositorio ---"
          for f in src/data/aerodromes.json src/data/waypoints.json src/tma-boundaries.json src/ctr-boundaries.json src/fir-boundaries.json; do
            if git diff --quiet -- "$f"; then echo "  identico: $f"; else echo "  MUDOU:    $f"; git diff --stat -- "$f" | tail -1; fi
          done
          echo "--- metadata gerado ---"
          jq '{fonte: .sources.geoserver_wfs, aerodromos: .layers."ICA:airport_heliport".officialCount,
               tma: .layers."ICA:TMA".amendment, futura_tma: .layers."ICA:TMA".futureAmendment}' src/data/metadata.json
          git status --porcelain
          exit 0

      - name: Probe with curl (different TLS/HTTP stack)
        shell: bash
        run: |
          set +e
          U='https://geoaisweb.decea.mil.br/geoserver/ICA/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=ICA:fir&outputFormat=application/json&count=1'
          echo "--- DNS ---"
          for h in geoaisweb.decea.mil.br geoaisweb.decea.gov.br aisweb.decea.mil.br aisweb.decea.gov.br; do
            echo "[$h]"; getent ahosts "$h" | awk '{print "  "$1"  "$3}' | sort -u | head -3
          done
          echo "--- curl default ---"
          curl -sS -o /tmp/b1 -D - --max-time 25 "$U" | head -20; head -c 300 /tmp/b1; echo
          echo "--- curl browser UA, HTTP/1.1 ---"
          curl -sS --http1.1 -o /tmp/b2 -D - --max-time 25 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36' \
            -H 'Accept-Language: pt-BR,pt;q=0.9' "$U" | head -20; head -c 300 /tmp/b2; echo
          echo "--- TLS / certificate ---"
          for h in geoaisweb.decea.mil.br geoaisweb.decea.gov.br; do
            echo "[$h]"; echo | openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null
          done
          exit 0
